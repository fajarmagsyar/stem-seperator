[package]
name = "stem-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
stem-core = { path = "../stem-core" }
stem-playback = { path = "../stem-playback" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
[dev-dependencies]
tempfile = "=3.23.0"
egui_kittest = "=0.33.3"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
[lints]
workspace = true
[[bin]]
name = "stem-desktop"
path = "src/main.rs"
